name: Deploy CERN chat backend

on:
  push:
    branches: [master]
    paths:
      - 'server/chat/**'
      - 'package*.json'
      - '.github/workflows/deploy-chat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cern-chat-backend
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:chat
  deploy:
    needs: verify
    environment: github-pages
    runs-on: [self-hosted, Linux, X64, compops]
    env:
      OPENSEARCH_AUTH_MODE: ${{ vars.OPENSEARCH_AUTH_MODE || 'kerberos' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        env:
          CERN_AI_KEY: ${{ secrets.CERN_AI_KEY }}
          CERN_OIDC_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CERN_OIDC_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          CHAT_BACKEND_URL: ${{ vars.CHAT_BACKEND_URL }}
        run: |
          set -eu
          test "$(hostname -s)" = cmscompops02 || { echo 'This deployment must run on cmscompops02'; exit 1; }
          command -v docker >/dev/null || { echo 'Docker is required on this runner'; exit 1; }
          docker info >/dev/null
          for key in CERN_AI_KEY CERN_OIDC_CLIENT_ID CERN_OIDC_CLIENT_SECRET CHAT_BACKEND_URL; do
            test -n "${!key}" || { echo "Missing $key in the github-pages environment"; exit 1; }
          done
          case "$CHAT_BACKEND_URL" in
            https://*/api/chat) ;;
            *) echo 'CHAT_BACKEND_URL must be https://YOUR-BACKEND-HOST/api/chat (no trailing slash)'; exit 1 ;;
          esac
      - name: Build backend image
        run: docker build -f server/chat/Dockerfile -t cmssdt-chat:${{ github.sha }} .
      - name: Start persistent backend
        env:
          CERN_AI_KEY: ${{ secrets.CERN_AI_KEY }}
          CERN_OIDC_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CERN_OIDC_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          CHAT_BACKEND_URL: ${{ vars.CHAT_BACKEND_URL }}
          CERN_AI_MODEL: ${{ vars.CERN_AI_MODEL || 'qwen3.8-27b-fp16' }}
        run: |
          set -eu
          export CERN_OIDC_REDIRECT_URI="$CHAT_BACKEND_URL/auth/callback"
          # Reuse the host's public CA trust without mounting private keys or
          # relabeling system certificate directories for rootless Podman.
          trust_dir="$HOME/.local/share/cmssdt-chat/tls"
          mkdir -p "$trust_dir"
          chmod 755 "$trust_dir"
          host_bundle=/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
          test -r "$host_bundle" || { echo 'Host CA bundle is unavailable'; exit 1; }
          cp "$host_bundle" "$trust_dir/ca-bundle.pem"
          chmod 644 "$trust_dir/ca-bundle.pem"
          runtime_args=(-e CURL_CA_BUNDLE=/run/cmssdt-trust/ca-bundle.pem
            -e NODE_EXTRA_CA_CERTS=/run/cmssdt-trust/ca-bundle.pem)
          if docker --version | grep -qi podman; then
            runtime_args+=(-v "$trust_dir:/run/cmssdt-trust:ro,Z")
          else
            runtime_args+=(-v "$trust_dir:/run/cmssdt-trust:ro")
          fi
          data_dir="$HOME/.local/share/cmssdt-chat/data"
          mkdir -p "$data_dir"
          chmod 700 "$data_dir"
          runtime_args+=(-e CHAT_DATA_DIR=/run/cmssdt-data --user "$(id -u):$(id -g)")
          if docker --version | grep -qi podman; then
            runtime_args+=(--userns keep-id -v "$data_dir:/run/cmssdt-data:rw,Z")
          else
            runtime_args+=(-v "$data_dir:/run/cmssdt-data:rw")
          fi
          if [ "$OPENSEARCH_AUTH_MODE" = kerberos ]; then
            umask 077
            cache_dir="$HOME/.local/share/cmssdt-chat/krb5"
            mkdir -p "$cache_dir"
            chmod 700 "$cache_dir"
            export OPENSEARCH_KRB5CCNAME=FILE:/run/cmssdt-krb5/ccache
            runtime_args+=(-e OPENSEARCH_KRB5CCNAME
              -e KRB5_CONFIG=/app/server/chat/krb5.conf)
            if docker --version | grep -qi podman; then
              runtime_args+=(-v "$cache_dir:/run/cmssdt-krb5:rw,Z")
            else
              runtime_args+=(-v "$cache_dir:/run/cmssdt-krb5:rw")
            fi
          elif [ "$OPENSEARCH_AUTH_MODE" != oidc ]; then
            echo 'OPENSEARCH_AUTH_MODE must be kerberos or oidc'; exit 1
          fi
          docker rm -f cmssdt-chat-backend 2>/dev/null || true
          # Rootless Podman forwarding helpers must survive Actions orphan cleanup.
          RUNNER_TRACKING_ID= docker run "${runtime_args[@]}" -d --name cmssdt-chat-backend --restart unless-stopped \
            --init --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL --security-opt no-new-privileges \
            --log-opt max-size=10m --log-opt max-file=3 \
            -p 127.0.0.1:8787:8787 \
            -e CERN_AI_KEY -e CERN_AI_MODEL \
            -e CERN_OIDC_CLIENT_ID -e CERN_OIDC_CLIENT_SECRET -e CERN_OIDC_REDIRECT_URI \
            -e CHAT_ALLOWED_ORIGINS=https://akritkbehera.github.io \
            cmssdt-chat:${{ github.sha }}
      - name: Check backend health
        run: |
          if ! curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
            --retry 10 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8787/api/chat/health >/dev/null; then
            docker inspect --format 'Container state: {{.State.Status}}; exit code: {{.State.ExitCode}}' cmssdt-chat-backend
            exit 1
          fi
          echo 'Backend is running on loopback port 8787. Authenticated MCP must be verified in the browser.'
